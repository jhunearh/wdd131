<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghana Country Page</title>
    <meta name="description" content="This page provides information about Ghana, including its data and weather conditions.">
    <meta name="author" content="Samuel Gyebi Yeboah">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>

    <header>
        <h1>Ghana</h1>
    </header>

    <main>

        <section class="hero">
            <picture>
                <source media="(min-width: 768px)"
                    srcset="images/ghana-large.webp">
                <img src="images/ghana-small.webp"
                    alt="Beautiful scenery in Ghana">
            </picture>
        </section>

        <section class="content">

            <section class="card data">
                <h2>Data</h2>

                <p><strong>Area:</strong> 238,535 sq km</p>
                <p><strong>Population:</strong> 33.5 million</p>
                <p><strong>Capital:</strong> Accra</p>
                <p><strong>Languages:</strong> English, Akan, Ewe, Ga</p>
                <p><strong>Currency:</strong> Ghana Cedi (GHS)</p>
                <p><strong>Time Zone:</strong> GMT</p>
            </section>

            <section class="card weather">
                <h2>Weather</h2>

                <img
                    src="images/weather.svg"
                    alt="weather icon"
                    class="weather-icon"
                >

                <p><strong>Temperature:</strong> 8°C</p>
                <p><strong>Conditions:</strong> Partly Cloudy</p>
                <p><strong>Wind:</strong> 10 km/h</p>
                <p>
                    <strong>Wind Chill:</strong>
                    <span id="windchill"></span>
                </p>

            </section>

        </section>

    </main>

    <footer>
        <p>
            © <span id="year"></span> Samuel Gyebi Yeboah | Ghana
        </p>

        <p>
            Last Modified:
            <span id="lastModified"></span>
        </p>
    </footer>

</body>
</html>
